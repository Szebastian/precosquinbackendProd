name = "precosquin-backend"
version = "0.1.0"
description = "Backend API for Pre-Cosquín festival inscription system"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "Pre-Cosquín Team", email = "contacto@precosquinpiramides.com"}
]
license = {text = "MIT"}
keywords = ["inscription", "festival", "backend", "api", "python"]
dependencies = [
    "uvicorn>=0.34.0",
    "fastapi>=0.115.0",
    "python-multipart>=0.0.20",
    "python-jose>=3.4.0",
    "supabase>=2.0.0",
    "pydantic>=2.0.0",
    "structlog>=24.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build_api"
